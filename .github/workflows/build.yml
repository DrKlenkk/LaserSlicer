name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed only to attach the files to a release on version tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run check

      - name: Upload the site (all files of dist/)
        uses: actions/upload-artifact@v4
        with:
          name: laserslicer-site
          path: dist/
          if-no-files-found: error

      - name: Zip the site (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: (cd dist && zip -r ../laserslicer-site.zip .)

      - name: Attach to release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            laserslicer-site.zip
            dist/index.html
