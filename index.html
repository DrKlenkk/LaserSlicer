<h1>Laser Slicer: 3D model to layered laser-cut plywood</h1>
<p>Laser Slicer is a free tool that slices a 3D model (STL, OBJ or 3MF) into flat layers and exports laser-ready DXF and SVG files for plywood that is stacked and glued into the shape. It runs entirely in your browser and works offline; your model never leaves your computer.</p>
<p>This page needs JavaScript to run the app. Enable JavaScript to use it.</p>
<ul>
<li>Import STL, OBJ and 3MF, set scale, slicing axis and sheet thickness</li>
<li>Kerf compensation and oversize, mid-plane or undersize outlines</li>
<li>Automatic nesting of the parts on your sheet size</li>
<li>Hollowing, dowel holes, holding bridges, layer labels and an assembly guide</li>
<li>Export DXF, SVG, PNG or JPG in one ZIP</li>
</ul>
